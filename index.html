<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Switch Lab</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f0e9;color:#171717}header{position:sticky;top:0;z-index:10;background:#f3f0e9ee;backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;border-bottom:1px solid #d7d2c8}.brand{font-size:20px;font-weight:700;letter-spacing:.08em}.toggle{display:flex;align-items:center;gap:11px;font-size:12px;letter-spacing:.08em}button{border:1px solid #222;background:#fff;border-radius:999px;width:58px;height:31px;padding:3px}.knob{display:block;width:23px;height:23px;border-radius:50%;background:#181818;transition:transform .5s cubic-bezier(.2,.8,.2,1)}body.on .knob{transform:translateX(27px)}main{padding:48px 5vw 70px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:32px}h1{font-size:clamp(38px,6vw,76px);font-weight:400;margin:0;letter-spacing:-.05em}.hero p{max-width:360px;line-height:1.5;color:#555}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#e7e1d6;overflow:hidden}.scene{height:370px;position:relative;background:#d7cfc2}.wall{position:absolute;inset:0 0 27%;background:#d9d1c4;transition:background .55s,filter .55s}.floor{position:absolute;left:0;right:0;bottom:0;height:27%;background:#b9aa96}.lamp{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:150px;height:220px}.shade{position:absolute;left:25px;top:20px;width:100px;height:70px;background:#bcb4a8;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);z-index:2;transition:.55s}.stem{position:absolute;width:7px;height:120px;background:#4c4a47;left:72px;top:84px}.base{position:absolute;width:74px;height:12px;border-radius:50%;background:#55514c;left:38px;top:200px}.glow{position:absolute;left:-30px;top:-20px;width:210px;height:190px;border-radius:50%;opacity:0;background:radial-gradient(circle,#ffdf96cc 0,#ffda8252 35%,#ffd26e00 72%);filter:blur(8px);transition:opacity .55s}body.on .glow{opacity:1}body.on .shade{background:#f3cf83;filter:brightness(1.2)}body.on .wall{background:#d8c8aa;filter:brightness(1.08)}.meta{padding:16px 18px;background:#f8f6f1;display:flex;justify-content:space-between}.status{font-size:11px;color:#777;letter-spacing:.08em}.note{margin-top:26px;padding:16px;border:1px solid #cbc5ba;font-size:13px;line-height:1.5}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{display:block}.hero p{margin-top:20px}.scene{height:340px}}
</style></head><body><header><div class="brand">LIGHT SWITCH LAB</div><div class="toggle"><span id="label">LIGHTS OFF</span><button id="toggle"><span class="knob"></span></button></div></header><main><section class="hero"><h1>Lighting,<br>before & after.</h1><p>0 kr proof-of-concept för en global light switch på en produktkatalog.</p></section><section class="grid" id="grid"></section><div class="note"><b>Frontend-test:</b> switchen kostar ingenting att använda. Nästa steg är riktiga OFF/ON-bildpar skapade med lokal relighting.</div></main><script>
const ps=['Arc Floor Lamp','Milo Table Lamp','Column Lamp','Halo Pendant','Studio Floor Lamp','Orb Table Lamp'],g=document.getElementById('grid');ps.forEach((p,i)=>g.insertAdjacentHTML('beforeend',`<article class="card"><div class="scene"><div class="wall"></div><div class="floor"></div><div class="lamp"><div class="glow"></div><div class="shade"></div><div class="stem"></div><div class="base"></div></div></div><div class="meta"><span>${p}</span><span class="status">OFF / ON</span></div></article>`));document.getElementById('toggle').onclick=()=>{document.body.classList.toggle('on');document.getElementById('label').textContent=document.body.classList.contains('on')?'LIGHTS ON':'LIGHTS OFF'};
</script></body></html>
