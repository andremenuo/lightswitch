<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Switch Lab</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f0e9;color:#171717}header{position:sticky;top:0;z-index:10;background:#f3f0e9ee;backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;border-bottom:1px solid #d7d2c8}.brand{font-size:20px;font-weight:700;letter-spacing:.08em}.toggle{display:flex;align-items:center;gap:11px;font-size:12px;letter-spacing:.08em}button{border:1px solid #222;background:#fff;border-radius:999px;width:58px;height:31px;padding:3px}.knob{display:block;width:23px;height:23px;border-radius:50%;background:#181818;transition:transform .5s cubic-bezier(.2,.8,.2,1)}body.on .knob{transform:translateX(27px)}main{padding:48px 5vw 70px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:32px}h1{font-size:clamp(38px,6vw,76px);font-weight:400;margin:0;letter-spacing:-.05em}.hero p{max-width:390px;line-height:1.5;color:#555}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#f8f6f1;overflow:hidden}.scene{height:260px;position:relative;background:#fff;overflow:hidden}.scene img{width:82%;height:82%;object-fit:contain;margin:9% auto;display:block;transition:filter .55s,transform .55s}.scene.paired img{position:absolute;inset:0;width:100%;height:100%;margin:0;object-fit:cover;transition:opacity 3s cubic-bezier(.22,.61,.36,1)}.scene.paired{background:#f7f7f5;transition:background 3s cubic-bezier(.22,.61,.36,1)}body.on .scene.paired{background:#604733}.scene.paired .on-img{opacity:0}.scene.paired .off-img{opacity:1}body.on .scene.paired .on-img{opacity:1}body.on .scene.paired .off-img{opacity:0}.meta{padding:16px 18px;background:#f8f6f1;display:flex;justify-content:space-between;gap:12px}.status{font-size:11px;color:#777;letter-spacing:.08em;white-space:nowrap}body.on .scene:not(.paired) img{filter:brightness(1.13) sepia(.12) saturate(1.12);transform:scale(1.01)}.note{margin-top:26px;padding:16px;border:1px solid #cbc5ba;font-size:13px;line-height:1.5}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{display:block}.hero p{margin-top:20px}.scene{height:230px}}</style></head>
<body><header><div class="brand">LIGHT SWITCH LAB</div><div class="toggle"><span id="label">LIGHTS OFF</span><button id="toggle"><span class="knob"></span></button></div></header>
<main><section class="hero"><h1>Lighting,<br>before & after.</h1><p>FADO använder nu två riktiga bildfiler: OFF och ON. Switchen crossfade:ar mellan dem.</p></section><section class="grid" id="grid"></section><div class="note"><b>Riktigt test:</b> FADO använder fado-off.jpg → fado-on.jpg. Övriga produkter har fortfarande placeholder-effekten tills vi skapar deras ON-versioner.</div></main>
<script>
const ps=[
["FADO","fado-off.jpg","fado-on.jpg"],
["VINDKAST","https://shop.r10s.jp/clair-kobe/cabinet/05074039/ikea/light5/m30539094.jpg"],
["ALLANIT","allanit-off.jpg","allanit-on.jpg"],
["SKAFTET","https://content.elmueble.com/medio/2021/07/01/lampara-de-pie-ikea-skaftet_cf9cfdc4_600x600.jpg"],
["UPPLID","upplid-off.jpg","upplid-on-final-v4.jpg"],
["KLÖVING","https://www.ikea.com.tw/dairyfarm/tw/images/418/1341867_PE948915_S5.jpg"],
["STORSEGEL","https://www.ikea.com.tw/dairyfarm/tw/images/857/1285773_PE933400_S4.webp"],
["NYMÅNE","https://i.greatcatalog.net/v/16/16753/16753-1-588%402x.jpg"],
["ÅRSTID","https://www.ikea.cn/cn/en/images/products/arstid-table-lamp-white__0609329_PE684454_S4.JPG"],
["TÄRNABY","tarnaby-off.jpg","tarnaby-on.jpg"]
];
const g=document.getElementById("grid");
ps.forEach(([p,off,on])=>{
 const scene=on?'<div class="scene paired"><img class="off-img" src="'+off+'" alt="'+p+' av"><img class="on-img" src="'+on+'" alt="'+p+' på"></div>':'<div class="scene"><img loading="lazy" src="'+off+'" alt="'+p+'"></div>';
 g.insertAdjacentHTML("beforeend",'<article class="card">'+scene+'<div class="meta"><span>'+p+'</span><span class="status">'+(on?'REAL OFF → ON':'OFF → ON TEST')+'</span></div></article>');
});
document.getElementById("toggle").onclick=()=>{document.body.classList.toggle("on");document.getElementById("label").textContent=document.body.classList.contains("on")?"LIGHTS ON":"LIGHTS OFF"};
</script></body></html>
