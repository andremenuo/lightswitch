<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Switch Lab</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f0e9;color:#171717}header{position:sticky;top:0;z-index:10;background:#f3f0e9ee;backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;border-bottom:1px solid #d7d2c8}.brand{font-size:20px;font-weight:700;letter-spacing:.08em}.toggle{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.08em;user-select:none}.toggle button{touch-action:manipulation}.state-label{font-weight:700;transition:opacity .3s,color .3s}.off-label{color:#171717}.on-label{color:#999}body.on .off-label{color:#999}body.on .on-label{color:#171717}button{border:1px solid #cfcfcf;background:#f4f4f4;border-radius:999px;width:72px;height:38px;padding:4px;position:relative;cursor:pointer;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:border-color .25s,background .25s,box-shadow .25s}button:hover{border-color:#999}button:focus-visible{outline:2px solid #222;outline-offset:3px}body.on button{background:#fff7e6;border-color:#e7bd68;box-shadow:inset 0 1px 2px rgba(0,0,0,.06),0 0 0 3px rgba(245,184,74,.10)}.switch-bulb{display:block;width:28px;height:28px;overflow:visible;transition:transform 3s cubic-bezier(.22,.61,.36,1)}.switch-bulb .bulb-glow{fill:#f5b84a;opacity:0;transform-origin:12px 10px;transition:opacity 3s cubic-bezier(.22,.61,.36,1),transform 3s cubic-bezier(.22,.61,.36,1)}.switch-bulb .bulb-glass{fill:#181818;stroke:#181818;stroke-width:1.35;transition:fill 3s cubic-bezier(.22,.61,.36,1),stroke 3s cubic-bezier(.22,.61,.36,1)}.switch-bulb .bulb-base,.switch-bulb .bulb-filament{fill:none;stroke:#181818;stroke-width:1.35;stroke-linecap:round;transition:stroke 3s cubic-bezier(.22,.61,.36,1)}body.on .switch-bulb{transform:translateX(34px)}body.on .switch-bulb .bulb-glow{opacity:.48;transform:scale(1.15)}body.on .switch-bulb .bulb-glass{fill:#ffd778;stroke:#a66b16}body.on .switch-bulb .bulb-base,body.on .switch-bulb .bulb-filament{stroke:#8d5a12}@media(prefers-reduced-motion:reduce){.switch-bulb,.switch-bulb *{transition:none!important}}main{padding:48px 5vw 70px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:32px}h1{font-size:clamp(38px,6vw,76px);font-weight:400;margin:0;letter-spacing:-.05em}.hero p{max-width:390px;line-height:1.5;color:#555}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#f8f6f1;overflow:hidden}.scene{height:260px;position:relative;background:#fff;overflow:hidden}.scene img{width:82%;height:82%;object-fit:contain;margin:9% auto;display:block;transition:filter .55s,transform .55s}.scene.paired img{position:absolute;inset:0;width:100%;height:100%;margin:0;object-fit:cover;transition:opacity 3s cubic-bezier(.22,.61,.36,1)}.scene.paired{background:#f7f7f5;transition:background 3s cubic-bezier(.22,.61,.36,1)}body.on .scene.paired{background:#604733}.scene.paired .on-img{opacity:0}.scene.paired .off-img{opacity:1}body.on .scene.paired .on-img{opacity:1}body.on .scene.paired .off-img{opacity:0}.meta{padding:16px 18px;background:#f8f6f1;display:flex;justify-content:space-between;gap:12px}.status{font-size:11px;color:#777;letter-spacing:.08em;white-space:nowrap}body.on .scene:not(.paired) img{filter:brightness(1.13) sepia(.12) saturate(1.12);transform:scale(1.01)}.note{margin-top:26px;padding:16px;border:1px solid #cbc5ba;font-size:13px;line-height:1.5}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{display:block}.hero p{margin-top:20px}.scene{height:230px}}.lab-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 20px 38px;text-align:center}.lab-hero h1{margin:0 0 24px;font-size:clamp(30px,5vw,56px);line-height:1;letter-spacing:-.04em}.lab-hero .toggle{gap:18px;font-size:18px;letter-spacing:.12em}.lab-hero button{width:112px;height:58px;padding:6px}.lab-hero .switch-bulb{width:44px;height:44px}.lab-hero body.on .switch-bulb{transform:translateX(0)}body.on .lab-hero .switch-bulb{transform:translateX(54px)}@media(max-width:800px){.lab-hero{padding:30px 16px 28px}.lab-hero h1{font-size:34px;margin-bottom:20px}.lab-hero .toggle{font-size:16px;gap:14px}.lab-hero button{width:100px;height:54px}.lab-hero .switch-bulb{width:40px;height:40px}body.on .lab-hero .switch-bulb{transform:translateX(46px)}}</style></head>
<body><header><div class="brand">LIGHT SWITCH LAB</div></header>
<main><section class="lab-hero"><div class="toggle"><span class="state-label off-label">AV</span><button id="toggle" aria-label="Slå av eller på ljuset"><svg class="switch-bulb" viewBox="0 0 24 24" aria-hidden="true"><circle class="bulb-glow" cx="12" cy="9.5" r="8.5"/><path class="bulb-glass" d="M7.2 9.1a4.8 4.8 0 1 1 9.6 0c0 2-1.1 3.2-2.2 4.3-.7.7-1 1.2-1 2.1h-3.2c0-.9-.3-1.4-1-2.1-1.1-1.1-2.2-2.3-2.2-4.3Z"/><path class="bulb-filament" d="M10 10.2l2 2 2-2M12 12.2v3.2"/><path class="bulb-base" d="M10.2 18h3.6M10.7 20h2.6"/></svg></button><span class="state-label on-label">PÅ</span></div></section><section class="grid" id="grid"></section><div class="note"><b>Riktigt test:</b> FADO använder fado-off.jpg → fado-on.jpg. Övriga produkter har fortfarande placeholder-effekten tills vi skapar deras ON-versioner.</div></main>
<script>
const ps=[
["FADO","fado-off.jpg","fado-on.jpg"],
["ALLANIT","allanit-off.jpg","allanit-on.jpg"],
["UPPLID","upplid-off.jpg","upplid-on-final-v4.jpg"],
["TÄRNABY","tarnaby-off.jpg","tarnaby-on-v4.jpg"],
["SKYMNINGEN","skymningen-off.jpg","skymningen-on.jpg"],
["STOCKHOLM 2025","stockholm-2025-off.jpg","stockholm-2025-on.jpg"],
["VALJE","valje-off.jpg","valje-on.jpg"],
["NORRA","norra-off.jpg","norra-on.jpg"],
["SALERNO","salerno-off.jpg","salerno-on.jpg"],
["SPA LAKESIDE","spa-lakeside-off.jpg","spa-lakeside-on.jpg"],
["SPA WINTER","spa-winter-off.jpg","spa-winter-on.jpg"],
["SPA ROUND","spa-round-off.jpg","spa-round-on.jpg"],
["SPA BACKYARD","spa-backyard-off.jpg","spa-backyard-on.jpg"],
["SPA SWEDISH DECK","spa-swedish-deck-off.jpg","spa-swedish-deck-on.jpg"],
];
const g=document.getElementById("grid");
ps.forEach(([p,off,on])=>{
 const scene=on?'<div class="scene paired"><img class="off-img" src="'+off+'" alt="'+p+' av"><img class="on-img" src="'+on+'" alt="'+p+' på"></div>':'<div class="scene"><img loading="lazy" src="'+off+'" alt="'+p+'"></div>';
 g.insertAdjacentHTML("beforeend",'<article class="card">'+scene+'<div class="meta"><span>'+p+'</span></div></article>');
});
document.getElementById("toggle").onclick=()=>{document.body.classList.toggle("on")};
</script></body></html>
